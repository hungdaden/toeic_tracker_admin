name: toeic_tracker_admin
description: "Hệ thống quản trị TOEIC Tracker"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Sử dụng cú pháp ^ để Flutter tự chọn bản vá lỗi tương thích nhất
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  
  provider: ^6.1.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  file_picker: ^8.1.3
  google_fonts: ^8.1.0
  flutter_spinkit: ^5.2.0
  google_generative_ai: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
